# Shared operator host; operator accounts are separate from Lima's administrator.
minimumLimaVersion: 2.3.0
vmType: vz
arch: aarch64
cpus: 2
memory: 4GiB
disk: 32GiB
images:
- location: https://cloud-images.ubuntu.com/releases/noble/release-20261017/ubuntu-24.04-server-cloudimg-arm64.img
  arch: aarch64
  digest: sha256:50e24e1fb79e89116e939d90aa7738f7af48c442fa1bc2510131e0b39c50348e
mounts: []
networkOpts:
  hostLoopback: false
propagateProxyEnv: false
ssh:
  loadDotSSHPubKeys: false
  forwardAgent: false
containerd:
  system: false
  user: false
portForwards:
- guestIP: 0.0.0.0
  guestPortRange: [1, 65535]
  proto: any
  ignore: true
user:
  name: operator-admin
  home: /home/operator-admin
provision:
- mode: system
  script: |
    #!/bin/sh
    set -eu
    if ! id tycho >/dev/null 2>&1; then
      useradd --create-home --shell /bin/bash tycho
    fi
    chmod 0700 /home/tycho
    for dir in identity graph workspace state .config .ssh; do
      install -d -m 0700 -o tycho -g tycho "/home/tycho/$dir"
    done
    install -d -m 0755 /etc/bellhouse/operators /srv/commons
    if [ ! -f /etc/bellhouse/operators/tycho.json ]; then
      printf '%s\n' '{"name":"tycho","user":"tycho","home":"/home/tycho","model":"opencode/deepseek-v4.1-flash","ready":false,"enabled":false}' > /etc/bellhouse/operators/tycho.json
      chmod 0644 /etc/bellhouse/operators/tycho.json
    fi
    # Configuration is read-only to operators; no implicit sudo or host mounts.
    printf '%s\n' 'umask 077' > /etc/profile.d/operator-umask.sh
